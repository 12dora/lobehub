name: Enterprise Compatibility Integrations

on:
  pull_request:
    types: [labeled, synchronize]
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  migration-compat:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'enterprise-integration')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-env
      - run: pnpm install
      - name: Run real migration compatibility suite
        env:
          MIGRATION_COMPAT_INTEGRATION: '1'
        run: |
          bunx vitest run --config vitest.config.mts --silent='passed-only' \
            --reporter=json --outputFile=.tmp/migration-compat.json \
            scripts/enterprise/verify-migration.integration.test.ts
          bun -e '
            const report = await Bun.file(".tmp/migration-compat.json").json();
            if ((report.numPendingTests ?? 0) > 0 || (report.numPassedTests ?? 0) === 0) process.exit(1);
          '

  prometheus-otlp-compat:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'enterprise-integration')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-env
      - run: pnpm install
      - name: Run real Prometheus and OTLP compatibility suite
        env:
          ENTERPRISE_PROM_INTEGRATION: '1'
        run: |
          bunx vitest run --config vitest.config.mts --silent='passed-only' \
            --reporter=json --outputFile=.tmp/prometheus-otlp-compat.json \
            scripts/enterprise/prometheus-alerts/checkRules.integration.test.ts
          bun -e '
            const report = await Bun.file(".tmp/prometheus-otlp-compat.json").json();
            if ((report.numPendingTests ?? 0) > 0 || (report.numPassedTests ?? 0) === 0) process.exit(1);
          '
