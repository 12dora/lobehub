name: Enterprise Admin Gates

# SCE-04 — wire enterprise-admin + identity-provider unit suites on PRs, and
# deterministic container-backed Playwright lanes on schedule / release / label.

on:
  pull_request:
    paths:
      - '.github/workflows/enterprise-admin-gates.yml'
      - 'e2e/enterprise-admin/**'
      - 'e2e/src/identity-provider/**'
      - 'e2e/package.json'
      - 'e2e/playwright.identity-provider.config.ts'
      - 'e2e/vitest.identity-provider.config.ts'
      - 'e2e/tsconfig.identity-provider.json'
      - 'apps/server/src/enterprise/**'
      - 'src/features/Admin/**'
      - 'packages/database/src/schemas/platform/**'
  push:
    branches:
      - canary
    paths:
      - '.github/workflows/enterprise-admin-gates.yml'
      - 'e2e/enterprise-admin/**'
      - 'e2e/src/identity-provider/**'
      - 'e2e/package.json'
  schedule:
    # Nightly Playwright lane (UTC)
    - cron: '17 3 * * *'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  unit:
    name: Enterprise-admin + identity-provider unit
    runs-on: ubuntu-latest
    # Suite includes Docker containers + a production-build case in infrastructure.fault;
    # 20m is chronically unmeetable on ubuntu-latest (vite+next build alone >10m).
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup environment
        uses: ./.github/actions/setup-env

      - name: Install dependencies
        run: pnpm install

      - name: Run enterprise-admin unit suite
        working-directory: e2e
        run: bun run test:enterprise-admin:unit

      - name: Run identity-provider unit suite
        working-directory: e2e
        run: bun run test:identity-provider:unit

  playwright-enterprise-admin:
    name: Enterprise-admin Playwright (isolated)
    # Full isolated suite: PR label, canary push of suite paths, schedule, or manual.
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/canary') ||
      (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'enterprise-admin-e2e'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup environment
        uses: ./.github/actions/setup-env

      - name: Install dependencies
        run: pnpm install

      - name: Install Playwright Chromium
        working-directory: e2e
        run: bunx playwright install --with-deps chromium

      - name: Run enterprise-admin Playwright suite
        working-directory: e2e
        env:
          CI: 'true'
        run: bun run test:enterprise-admin

      - name: Assert zero skipped Playwright results
        if: always()
        working-directory: e2e
        run: |
          set -euo pipefail
          results="enterprise-admin/reports/results.json"
          test -f "$results"
          bun -e '
            const r = JSON.parse(await Bun.file(process.argv[1]).text());
            const suites = r.suites ?? [];
            const walk = (nodes, acc = { passed: 0, failed: 0, skipped: 0, flaky: 0 }) => {
              for (const n of nodes) {
                for (const spec of n.specs ?? []) {
                  for (const t of spec.tests ?? []) {
                    const status = t.status ?? t.results?.[0]?.status;
                    if (status === "skipped" || status === "pending") acc.skipped++;
                    else if (status === "flaky") acc.flaky++;
                    else if (status === "expected" || status === "passed") acc.passed++;
                    else acc.failed++;
                  }
                }
                walk(n.suites ?? [], acc);
              }
              return acc;
            };
            const counts = walk(suites);
            // Playwright root also exposes stats
            const stats = r.stats ?? {};
            const skipped = counts.skipped + (stats.skipped ?? 0);
            const expected = 6;
            if (counts.passed + (stats.expected ?? 0) < expected && counts.passed < expected) {
              // Prefer suite walk; fall back to stats.expected
              const totalPassed = Math.max(counts.passed, stats.expected ?? 0);
              if (totalPassed < expected) {
                console.error("enterprise-admin: expected >= 6 passed tests", { counts, stats });
                process.exit(1);
              }
            }
            if (skipped > 0 || counts.flaky > 0) {
              console.error("enterprise-admin: skipped/flaky results are not allowed", { counts, stats });
              process.exit(1);
            }
            console.log("enterprise-admin playwright gate ok", { counts, stats });
          ' "$results"

      - name: Upload enterprise-admin evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          if-no-files-found: warn
          name: enterprise-admin-e2e-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            e2e/enterprise-admin/reports
            .records/enterprise-admin-e2e
          retention-days: 14

  playwright-identity-provider:
    name: Identity-provider supervised restart (deterministic)
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'identity-provider-e2e'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup environment
        uses: ./.github/actions/setup-env

      - name: Install dependencies
        run: pnpm install

      - name: Install Playwright Chromium
        working-directory: e2e
        run: bunx playwright install --with-deps chromium

      - name: Run identity-provider Playwright suite
        working-directory: e2e
        env:
          CI: 'true'
        run: bun run test:identity-provider

      - name: Assert supervised-restart postcondition
        if: always()
        working-directory: e2e
        run: |
          set -euo pipefail
          results="reports/identity-provider-results.json"
          test -f "$results"
          bun -e '
            const r = JSON.parse(await Bun.file(process.argv[1]).text());
            const suites = r.suites ?? [];
            const tests = [];
            const walk = (nodes) => {
              for (const n of nodes) {
                for (const spec of n.specs ?? []) {
                  for (const t of spec.tests ?? []) {
                    const status = t.status ?? t.results?.[0]?.status;
                    tests.push({
                      title: spec.title ?? t.title ?? "",
                      fullTitle: [...(spec.title ? [spec.title] : []), ...(n.title ? [n.title] : [])].join(" "),
                      status,
                      project: t.projectName,
                    });
                  }
                }
                walk(n.suites ?? []);
              }
            };
            walk(suites);
            // Flatten via stats + title search for robustness across reporter shapes
            const allTitles = [];
            const collectTitles = (nodes, parents = []) => {
              for (const n of nodes) {
                const chain = n.title ? [...parents, n.title] : parents;
                for (const spec of n.specs ?? []) {
                  for (const t of spec.tests ?? []) {
                    const status = t.status ?? t.results?.[0]?.status;
                    allTitles.push({
                      title: spec.title ?? "",
                      full: [...chain, spec.title ?? ""].filter(Boolean).join(" › "),
                      status,
                    });
                  }
                }
                collectTitles(n.suites ?? [], chain);
              }
            };
            collectTitles(suites);

            const restart = allTitles.find((t) =>
              /supervised restart/i.test(t.title) || /supervised restart/i.test(t.full),
            );
            if (!restart) {
              console.error("identity-provider: supervised-restart test not found", allTitles);
              process.exit(1);
            }
            if (restart.status !== "expected" && restart.status !== "passed") {
              console.error("identity-provider: supervised-restart must pass", restart);
              process.exit(1);
            }

            const skipped = allTitles.filter(
              (t) => t.status === "skipped" || t.status === "pending",
            );
            const allowedSkip = (t) =>
              /real-tenant|real tenant|external Authentik|keeps real-tenant/i.test(
                `${t.title} ${t.full}`,
              );
            const unexpectedSkip = skipped.filter((t) => !allowedSkip(t));
            if (unexpectedSkip.length > 0) {
              console.error(
                "identity-provider: only the credential-gated real-tenant case may skip",
                { unexpectedSkip, skipped },
              );
              process.exit(1);
            }
            console.log("identity-provider playwright gate ok", {
              restart,
              skippedCount: skipped.length,
            });
          ' "$results"

      - name: Upload identity-provider evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          if-no-files-found: warn
          name: identity-provider-e2e-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            e2e/reports
            e2e/src/identity-provider
          retention-days: 14
