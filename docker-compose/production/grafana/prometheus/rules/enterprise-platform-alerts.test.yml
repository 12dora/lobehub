# Semantic unit tests for enterprise platform reference alerts (promtool test rules).
# Authoritative for EnterpriseOperationalCollectionStale collector identity / absence /
# replica aggregation. Does not claim production deployment or notification routing.
rule_files:
  - enterprise-platform-alerts.yml

evaluation_interval: 1m

# Shared annotation blob must match the production rule description exactly (folded).
# Keep in sync with enterprise-platform-alerts.yml EnterpriseOperationalCollectionStale.

tests:
  - name: operational both collectors healthy
    interval: 1m
    input_series:
      - series: 'enterprise_platform_operational_snapshot_ready{enterprise_collector="job_backlog",enterprise_scope="cluster",instance="r1"}'
        values: '1x20'
      - series: 'enterprise_platform_operational_snapshot_ready{enterprise_collector="revision_lag",enterprise_scope="cluster",instance="r1"}'
        values: '1x20'
      - series: 'enterprise_platform_operational_snapshot_age_seconds{enterprise_collector="job_backlog",enterprise_scope="cluster",instance="r1"}'
        values: '30x20'
      - series: 'enterprise_platform_operational_snapshot_age_seconds{enterprise_collector="revision_lag",enterprise_scope="cluster",instance="r1"}'
        values: '30x20'
    alert_rule_test:
      - eval_time: 10m
        alertname: EnterpriseOperationalCollectionStale
        exp_alerts: []

  - name: operational revision_lag absent backlog healthy
    interval: 1m
    input_series:
      - series: 'enterprise_platform_operational_snapshot_ready{enterprise_collector="job_backlog",enterprise_scope="cluster",instance="r1"}'
        values: '1x20'
      - series: 'enterprise_platform_operational_snapshot_age_seconds{enterprise_collector="job_backlog",enterprise_scope="cluster",instance="r1"}'
        values: '20x20'
    alert_rule_test:
      - eval_time: 10m
        alertname: EnterpriseOperationalCollectionStale
        exp_alerts:
          - exp_labels:
              alertname: EnterpriseOperationalCollectionStale
              severity: warning
              component: enterprise-operational-collector
              enterprise_collector: revision_lag
            exp_annotations:
              summary: Enterprise operational metric collection is stale or never initialized
              description: 'Fires for 5m when any required operational collector (job_backlog, revision_lag) has ready==0 after max-by-replica, is entirely absent, or has snapshot age > 180s (reference default). Per-collector identity prevents one healthy collector from masking another. Cluster snapshot gauges use max across replicas, never sum.'
              runbook: docs/enterprise/runbooks/enterprise-prometheus-alerts.md#enterpriseoperationalcollectionstale

  - name: operational job_backlog absent revision_lag healthy
    interval: 1m
    input_series:
      - series: 'enterprise_platform_operational_snapshot_ready{enterprise_collector="revision_lag",enterprise_scope="cluster",instance="r1"}'
        values: '1x20'
      - series: 'enterprise_platform_operational_snapshot_age_seconds{enterprise_collector="revision_lag",enterprise_scope="cluster",instance="r1"}'
        values: '20x20'
    alert_rule_test:
      - eval_time: 10m
        alertname: EnterpriseOperationalCollectionStale
        exp_alerts:
          - exp_labels:
              alertname: EnterpriseOperationalCollectionStale
