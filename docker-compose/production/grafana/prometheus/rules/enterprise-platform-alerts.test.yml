        values: '1x20'
      - series: 'enterprise_platform_operational_collector_enabled{enterprise_collector="revision_lag",enterprise_scope="cluster",instance="r1"}'
        values: '0x20'
      - series: 'enterprise_platform_operational_snapshot_ready{enterprise_collector="job_backlog",enterprise_scope="cluster",instance="r1"}'
        values: '1x20'
