        values: '1x20'
      - series: 'enterprise_platform_operational_snapshot_ready{enterprise_collector="job_backlog",enterprise_scope="cluster",instance="r1"}'
        values: '1x20'
      - series: 'enterprise_platform_operational_snapshot_age_seconds{enterprise_collector="job_backlog",enterprise_scope="cluster",instance="r1"}'
        values: '20x20'
    alert_rule_test:
      - eval_time: 10m
        alertname: EnterpriseOperationalCollectionStale
        exp_alerts:
          - exp_labels:
              alertname: EnterpriseOperationalCollectionStale
              severity: warning
              component: enterprise-operational-collector
              enterprise_collector: revision_lag
            exp_annotations:
              summary: Enterprise operational metric collection is stale or never initialized
              description: 'Fires for 5m when the required job_backlog collector-enabled signal is not reaching Prometheus (no-data), or when any enabled collector (enabled==1) has ready==0, absent ready, or age>180s after max-by-replica (reference default). No-data does not identify which hop failed: app/runtime not running, activation never reached, OTel exporter/collector failure, remote-write/scrape/ingestion loss, or configuration omission are all plausible. Disabled collectors (enabled=0, e.g. revision_lag without DB OIDC) do not alert. Per-collector identity prevents masking; never sum replicas.'
