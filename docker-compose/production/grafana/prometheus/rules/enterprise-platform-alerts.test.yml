              runbook: docs/enterprise/runbooks/enterprise-prometheus-alerts.md#enterpriseoperationalcollectionstale
          - exp_labels:
              alertname: EnterpriseOperationalCollectionStale
              severity: warning
              component: enterprise-operational-collector
              enterprise_collector: revision_lag
            exp_annotations:
              summary: Enterprise operational metric collection is stale or never initialized
              description: 'Fires for 5m when any required operational collector (job_backlog, revision_lag) has ready==0 after max-by-replica, is entirely absent, or has snapshot age > 180s (reference default). Per-collector identity prevents one healthy collector from masking another. Cluster snapshot gauges use max across replicas, never sum.'
