global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Enterprise platform reference rules (M14 / W9 O06).
# Notification receivers are deployment-owned and intentionally unconfigured here.
# Firing rules remain visible in the Prometheus UI without Alertmanager.
# Explicit path so semantic `*.test.yml` fixtures in this directory are not loaded as rules.
rule_files:
  - /etc/prometheus/rules/enterprise-platform-alerts.yml

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['127.0.0.1:9090']
  - job_name: 'tempo'
    static_configs:
      - targets: ['127.0.0.1:3200']
