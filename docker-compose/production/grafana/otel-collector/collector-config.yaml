extensions:
  health_check:
    endpoint: 127.0.0.1:13133

receivers:
  prometheus:
    config:
      scrape_configs:
        - job_name: otel-collector-metrics
          scrape_interval: 10s
          static_configs:
            - targets: ['127.0.0.1:8888']

  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

exporters:
  prometheusremotewrite:
    endpoint: http://127.0.0.1:9090/api/v1/write
    tls:
      insecure: true

  otlp:
    endpoint: 127.0.0.1:14317
    tls:
      insecure: true

  debug:
    verbosity: detailed

service:
  pipelines:
    # Include OTLP so LobeHub enterprise platform metrics (and other app OTLP metrics)
    # reach Prometheus remote-write alongside collector self-scrapes. Alert rules load
    # in Prometheus regardless; without OTLP here app metrics never arrive in this example.
    metrics:
      receivers: [otlp, prometheus]
      exporters: [prometheusremotewrite]
    traces:
      receivers: [otlp]
      exporters: [otlp]
    logs:
      receivers: [otlp]
      exporters: [debug]
