# Pinned runtime: otel/opentelemetry-collector-contrib:0.120.0
# Component IDs use canonical type names for that distribution
# (otlp, prometheus, prometheusremotewrite, debug, health_check — not deprecated aliases).
extensions:
  health_check:
    endpoint: 127.0.0.1:13133

receivers:
  prometheus:
    config:
      scrape_configs:
        - job_name: otel-collector-metrics
          scrape_interval: 10s
          static_configs:
            - targets: ['127.0.0.1:8888']

  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

exporters:
  # Enterprise app metrics (OTLP) and collector self-scrapes land in Prometheus via remote-write.
  prometheusremotewrite:
    endpoint: http://127.0.0.1:9090/api/v1/write
    tls:
      insecure: true

  otlp:
    endpoint: 127.0.0.1:14317
    tls:
      insecure: true

  # Canonical id is `debug` (not the deprecated `logging` exporter).
  debug:
    verbosity: basic

service:
  extensions: [health_check]
  pipelines:
    # OTLP must be on the metrics pipeline or enterprise platform metrics never reach Prometheus.
    metrics:
      receivers: [otlp, prometheus]
      exporters: [prometheusremotewrite]
    traces:
      receivers: [otlp]
      exporters: [otlp]
    logs:
      receivers: [otlp]
      exporters: [debug]
